name: Changelog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check CHANGELOG sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify contract versions are recorded in CHANGELOG.md
        run: bash scripts/check-changelog.sh
